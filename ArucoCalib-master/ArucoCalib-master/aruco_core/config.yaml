# ArUco Marker Configuration
aruco:
  # ArUco dictionary type (DICT_APRILTAG_36h11, DICT_5X5_100, etc.)
  dict_type: "DICT_APRILTAG_36h11"
  # Calibration tag side length in meters. Homography currently uses tag centers.
  marker_size: 0.20  # Calibration tags are 20cm x 20cm.
  # 36h11 has an 11-bit minimum code distance. With errorCorrectionRate=0.6,
  # this permits about 3 bad data bits while retaining a conservative margin.
  max_correction_bits: 5

# ArUco detector parameter overrides (optional).
# Useful for far/small markers: reduce minMarkerPerimeterRate and tune adaptive threshold windows.
aruco_params:
  # Accept smaller marker perimeter (for far markers). Typical default ~0.03.
  minMarkerPerimeterRate: 0.02
  # Adaptive threshold window sizes.
  adaptiveThreshWinSizeMin: 3
  adaptiveThreshWinSizeMax: 23
  adaptiveThreshWinSizeStep: 10
  # Effective correction allowance: 0.6 * 5 = about 3 data bits.
  errorCorrectionRate: 0.6
  # Corner refinement method: NONE / SUBPIX / CONTOUR / APRILTAG
  cornerRefinementMethod: "NONE"

# Four calibration-corner coordinates. Numeric keys are legacy labels only;
# detected tag IDs are ignored and duplicate IDs are supported.
# Format: legacy_corner_key: [x, y]
# Units: millimeters (mm)
# AR world: field bottom-right reference is (X=500mm, Z=400mm), +X points left, +Z points up.
# The homography's second coordinate is emitted as AR Z.
# Corner slots: 1=bottom-right, 2=top-right, 3=bottom-left, 4=top-left.
world_coordinates:
  1: [500.0, 400.0]
  2: [500.0, 3400.0]
  3: [4500.0, 400.0]
  4: [4500.0, 3400.0]

# Vehicle marker ID (unchanged; may duplicate a locked fixed-tag ID)
vehicle_id: 0

# Minimum number of markers required for calibration
min_marker_count: 4

# UI configuration (optional)
ui:
  # Trajectory display time window in milliseconds
  trace_window_ms: 500
# Fixed industrial-camera capture; only camera index is selectable in the UI.
camera:
  index: 0
  backend: "DSHOW"
  width: 1920
  height: 1200
  fps: 60
  fourcc: "YUY2"
  mirror: true
  auto_exposure: true
  exposure: -6
  gain: 0
  brightness: 0
  contrast: 0
  saturation: 0
  hue: 0
  sharpness: 0

# UDP output to RK3588S ar_receiver external pose input (board_ip:9005).
udp:
  enabled: false
  target_ip: "127.0.0.1"
  target_port: 9005

# Optional Windows gamepad manual control output.
# This does not replace localization UDP. It only sends packets when the UI
# Gamepad Mode checkbox is explicitly enabled.
gamepad_control:
  target_port: 9010
  max_speed_mps: 1.0
  steer_error_scale: 210.0

# Output coordinate conversion.
# This project stores world coordinates in millimeters; UI and UDP use meters.
output:
  coord_scale: 0.001
  height_m: 0.0
  x_sign: 1.0
  z_sign: 1.0
  yaw_sign: 1.0
  yaw_offset_deg: 0.0

# Lightweight output smoothing for EXE HUD/trajectory/UDP.
# Higher alpha follows raw detections faster; lower alpha is smoother but more delayed.
pose_filter:
  enabled: true
  position_alpha: 0.35
  yaw_alpha: 0.35
  reset_gap_s: 0.35

# After four-corner lock, every camera frame is rectified to one uniform field
# scale and detected once. This enlarges far/top tags without a second pass.
vehicle_detection_rectification:
  enabled: true
  scale_px_per_mm: 0.30
  margin_mm: 150.0
  max_dimension: 1600

