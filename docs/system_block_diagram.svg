<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263238"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ef6c00"/>
    </marker>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17202a; }
      .subtitle { font: 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #455a64; }
      .lane { fill: #ffffff; stroke: #90a4ae; stroke-width: 2.2; rx: 18; }
      .lane-win { fill: #f2f7ff; stroke: #6fa8dc; }
      .lane-rk { fill: #f3fbf4; stroke: #66bb6a; }
      .lane-tc { fill: #fff7ed; stroke: #ffb74d; }
      .lane-bottom { fill: #ffffff; stroke: #b0bec5; }
      .lane-title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #263238; }
      .lane-note { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #546e7a; }
      .box { fill: #ffffff; stroke: #607d8b; stroke-width: 1.7; rx: 10; }
      .box-blue { fill: #e8f1ff; stroke: #1976d2; }
      .box-green { fill: #e8f5e9; stroke: #43a047; }
      .box-orange { fill: #fff3e0; stroke: #fb8c00; }
      .box-purple { fill: #f3e5f5; stroke: #8e24aa; }
      .box-gray { fill: #f7f9fa; stroke: #78909c; }
      .box-red { fill: #ffebee; stroke: #e53935; }
      .box-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2933; }
      .box-text { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #334e5c; }
      .small-title { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2933; }
      .small-text { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #334e5c; }
      .arrow { fill: none; stroke: #263238; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #1565c0; stroke-width: 2.3; marker-end: url(#arrowBlue); }
      .arrow-green { fill: none; stroke: #2e7d32; stroke-width: 2.3; marker-end: url(#arrowGreen); }
      .arrow-orange { fill: none; stroke: #ef6c00; stroke-width: 2.3; marker-end: url(#arrowOrange); }
      .arrow-dash { fill: none; stroke: #607d8b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .arrow-label { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #263238; }
      .legend-text { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #37474f; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1350"/>
  <text class="title" x="900" y="52" text-anchor="middle">SYSU_DDL 智能车系统框图</text>
  <text class="subtitle" x="900" y="82" text-anchor="middle">大框表示父模块，小框表示子模块；同级并行链路使用近似相同尺寸；定位只参与 AR 融合、HUD 和记录，不参与控车决策。</text>

  <!-- Top level lanes -->
  <rect class="lane lane-win" x="40" y="110" width="420" height="820"/>
  <text class="lane-title" x="60" y="146">Windows 侧工具链</text>
  <text class="lane-note" x="60" y="172">定位、调试、远程查看、人工输入</text>

  <rect class="lane lane-rk" x="500" y="110" width="850" height="820"/>
  <text class="lane-title" x="520" y="146">RK3588S 上位机</text>
  <text class="lane-note" x="520" y="172">官方 AR 视频、AI 感知、状态机、局部规划、串口下发、HUD</text>

  <rect class="lane lane-tc" x="1390" y="110" width="370" height="820"/>
  <text class="lane-title" x="1410" y="146">TC264D 下位机</text>
  <text class="lane-note" x="1410" y="172">状态执行、PID、PWM、硬限幅、安全保护</text>

  <!-- Windows side -->
  <rect class="box box-blue" x="70" y="205" width="360" height="105"/>
  <text class="box-title" x="88" y="233">AprilTag / ArUco 定位</text>
  <text class="box-text" x="88" y="259">输出位姿 x/y/z/yaw</text>
  <text class="box-text" x="88" y="281">仅用于 AR 融合、HUD、记录</text>

  <rect class="box box-blue" x="70" y="335" width="360" height="105"/>
  <text class="box-title" x="88" y="363">Setup WebUI 浏览器</text>
  <text class="box-text" x="88" y="389">配置、WASD 虚拟位姿、状态查看</text>
  <text class="box-text" x="88" y="411">可向 RK WebUIStatusServer 发请求</text>

  <rect class="box box-purple" x="70" y="465" width="360" height="105"/>
  <text class="box-title" x="88" y="493">Windows 调试浏览器</text>
  <text class="box-text" x="88" y="519">访问 8090/debug_feed</text>
  <text class="box-text" x="88" y="541">查看分割、目标框、规划线、HUD</text>

  <rect class="box box-blue" x="70" y="595" width="360" height="105"/>
  <text class="box-title" x="88" y="623">手柄 / 键盘映射</text>
  <text class="box-text" x="88" y="649">Tools_Windows/gamepad_mapper.py</text>
  <text class="box-text" x="88" y="671">发送人工控制 UDP</text>

  <rect class="box box-gray" x="70" y="725" width="360" height="105"/>
  <text class="box-title" x="88" y="753">数据集与实测记录</text>
  <text class="box-text" x="88" y="779">浏览器录屏、调试截图、日志回放</text>
  <text class="box-text" x="88" y="801">辅助改进分割和目标检测模型</text>

  <!-- RK top service blocks -->
  <rect class="box box-green" x="525" y="205" width="250" height="115"/>
  <text class="box-title" x="543" y="233">pose_ar_bridge.py</text>
  <text class="box-text" x="543" y="259">接收 Windows 位姿 UDP</text>
  <text class="box-text" x="543" y="281">转发给官方 AR 引擎</text>
  <text class="box-text" x="543" y="303">不参与路径规划</text>

  <rect class="box box-green" x="800" y="205" width="250" height="115"/>
  <text class="box-title" x="818" y="233">官方 AR 融合引擎</text>
  <text class="box-text" x="818" y="259">dist/app / setup_webui</text>
  <text class="box-text" x="818" y="281">融合位姿和虚拟场景</text>
  <text class="box-text" x="818" y="303">输出 shm_ar_video</text>

  <rect class="box box-purple" x="1075" y="205" width="250" height="115"/>
  <text class="box-title" x="1093" y="233">Web / 调试服务</text>
  <text class="box-text" x="1093" y="259">webui_status_server.py</text>
  <text class="box-text" x="1093" y="281">ui_debug_stream_server.py</text>
  <text class="box-text" x="1093" y="303">状态 JSON + MJPEG 调试流</text>

  <!-- RK ar_receiver parent -->
  <rect class="box box-green" x="525" y="350" width="800" height="520"/>
  <text class="box-title" x="545" y="381">ar_receiver.py 调度主循环</text>
  <text class="box-text" x="545" y="405">读取 shm_ar_video，串联感知、状态机、规划、仲裁、串口下发、HUD 发布</text>

  <!-- ar_receiver child blocks, row 1 -->
  <rect class="box box-gray" x="550" y="430" width="225" height="120"/>
  <text class="small-title" x="568" y="456">vision_frame_source.py</text>
  <text class="small-text" x="568" y="480">从 shm_ar_video 取帧</text>
  <text class="small-text" x="568" y="502">输出 frame_id + BGR frame</text>
  <text class="small-text" x="568" y="524">raw_fps 统计入口</text>

  <rect class="box box-green" x="800" y="430" width="225" height="120"/>
  <text class="small-title" x="818" y="456">vision_pipeline.py</text>
  <text class="small-text" x="818" y="480">语义分割：segmentation</text>
  <text class="small-text" x="818" y="502">目标检测：detections</text>
  <text class="small-text" x="818" y="524">红绿灯框内 OpenCV 识别</text>

  <rect class="box box-green" x="1050" y="430" width="250" height="120"/>
  <text class="small-title" x="1068" y="456">感知后处理</text>
  <text class="small-text" x="1068" y="480">seg_func.py：road_mask / midline</text>
  <text class="small-text" x="1068" y="502">输出 track_error / line_valid</text>
  <text class="small-text" x="1068" y="524">检测类别：gold / car / human / stone 等</text>

  <!-- ar_receiver child blocks, row 2 -->
  <rect class="box box-orange" x="550" y="580" width="225" height="135"/>
  <text class="small-title" x="568" y="606">control_task_state_machine.py</text>
  <text class="small-text" x="568" y="630">NORMAL_TRACK / AVOID_CAR</text>
  <text class="small-text" x="568" y="652">AVOID_HUMAN / COLLECT_GOLD</text>
  <text class="small-text" x="568" y="674">AVOID_STONE / RECOVER_LINE</text>
  <text class="small-text" x="568" y="696">输出 desired_speed + planner_intent</text>

  <rect class="box box-orange" x="800" y="580" width="225" height="135"/>
  <text class="small-title" x="818" y="606">control_race_state_machine.py</text>
  <text class="small-text" x="818" y="630">Door / BeginSign / EndSign</text>
  <text class="small-text" x="818" y="652">红灯停车、绿灯通行</text>
  <text class="small-text" x="818" y="674">圈数、终点停车确认</text>
  <text class="small-text" x="818" y="696">不使用 AR 坐标</text>

  <rect class="box box-orange" x="1050" y="580" width="250" height="135"/>
  <text class="small-title" x="1068" y="606">control_local_planner.py</text>
  <text class="small-text" x="1068" y="630">根据状态生成局部目标线</text>
  <text class="small-text" x="1068" y="652">人：结合横向运动绕背后</text>
  <text class="small-text" x="1068" y="674">车/石头/金币：图像坐标局规划</text>
  <text class="small-text" x="1068" y="696">输出 final_track_error</text>

  <!-- ar_receiver child blocks, row 3 -->
  <rect class="box box-red" x="550" y="745" width="225" height="95"/>
  <text class="small-title" x="568" y="771">control_arbitrator.py</text>
  <text class="small-text" x="568" y="795">选择自动驾驶或手柄覆盖</text>
  <text class="small-text" x="568" y="817">轻量化：CMD err 直通 final err</text>

  <rect class="box box-red" x="800" y="745" width="225" height="95"/>
  <text class="small-title" x="818" y="771">control_car_link.py</text>
  <text class="small-text" x="818" y="795">封装串口控制入口</text>
  <text class="small-text" x="818" y="817">发送 track_error / speed / state</text>

  <rect class="box box-red" x="1050" y="745" width="250" height="95"/>
  <text class="small-title" x="1068" y="771">control_serial_comm.py</text>
  <text class="small-text" x="1068" y="795">UART 460800，14B 控制帧</text>
  <text class="small-text" x="1068" y="817">接收 50B TC264D 反馈帧</text>

  <!-- TC264D child blocks -->
  <rect class="box box-orange" x="1420" y="205" width="310" height="95"/>
  <text class="box-title" x="1438" y="232">Communication.c / isr.c</text>
  <text class="box-text" x="1438" y="258">UART1 RX 中断即时解码</text>
  <text class="box-text" x="1438" y="280">校验帧头、地址、长度、checksum</text>

  <rect class="box box-orange" x="1420" y="325" width="310" height="95"/>
  <text class="box-title" x="1438" y="352">State.h / State.c</text>
  <text class="box-text" x="1438" y="378">STATE_TRACK / AVOID_HUMAN 等</text>
  <text class="box-text" x="1438" y="400">与上位机 task_state 对齐</text>

  <rect class="box box-orange" x="1420" y="445" width="310" height="120"/>
  <text class="box-title" x="1438" y="472">Control.c 10ms 控制环</text>
  <text class="box-text" x="1438" y="498">control_update()</text>
  <text class="box-text" x="1438" y="520">串口超时保护</text>
  <text class="box-text" x="1438" y="542">按状态加载 PID / 速度参数</text>

  <rect class="box box-orange" x="1420" y="590" width="310" height="105"/>
  <text class="box-title" x="1438" y="617">Motor.c / PID.c</text>
  <text class="box-text" x="1438" y="643">编码器速度反馈</text>
  <text class="box-text" x="1438" y="665">电机速度 PID + PWM 硬限幅</text>

  <rect class="box box-orange" x="1420" y="720" width="310" height="105"/>
  <text class="box-title" x="1438" y="747">Servo.c / Servo.h</text>
  <text class="box-text" x="1438" y="773">舵机 PD 输出</text>
  <text class="box-text" x="1438" y="795">SERVO_DUTY_MIN/MID/MAX 硬限幅</text>

  <rect class="box box-gray" x="1420" y="850" width="310" height="55"/>
  <text class="box-title" x="1438" y="884">硬件：电机、编码器、舵机、电源</text>

  <!-- Bottom diagnostic/data contract lane -->
  <rect class="lane lane-bottom" x="40" y="970" width="1720" height="320"/>
  <text class="lane-title" x="60" y="1006">通信链路与数据契约</text>

  <rect class="box box-blue" x="70" y="1030" width="315" height="115"/>
  <text class="small-title" x="88" y="1056">定位链路</text>
  <text class="small-text" x="88" y="1080">Windows AprilTag 位姿 UDP</text>
  <text class="small-text" x="88" y="1102">RK pose_ar_bridge 转发给官方 AR</text>
  <text class="small-text" x="88" y="1124">只用于融合视频、HUD、记录</text>

  <rect class="box box-green" x="410" y="1030" width="315" height="115"/>
  <text class="small-title" x="428" y="1056">视频链路</text>
  <text class="small-text" x="428" y="1080">官方 AR -> shm_ar_video</text>
  <text class="small-text" x="428" y="1102">ar_receiver 读取共享内存</text>
  <text class="small-text" x="428" y="1124">DebugStreamServer 发布 8090/debug_feed</text>

  <rect class="box box-orange" x="750" y="1030" width="315" height="115"/>
  <text class="small-title" x="768" y="1056">自动驾驶控制链路</text>
  <text class="small-text" x="768" y="1080">segmentation + detections</text>
  <text class="small-text" x="768" y="1102">task_state + planner_intent</text>
  <text class="small-text" x="768" y="1124">final_track_error -> CMD error</text>

  <rect class="box box-red" x="1090" y="1030" width="315" height="115"/>
  <text class="small-title" x="1108" y="1056">串口协议</text>
  <text class="small-text" x="1108" y="1080">RK -> TC264D：0x42/0x10/10B</text>
  <text class="small-text" x="1108" y="1102">float error + float speed + state + flags</text>
  <text class="small-text" x="1108" y="1124">TC264D -> RK：0x42/0x90/46B 反馈</text>

  <rect class="box box-purple" x="1430" y="1030" width="300" height="115"/>
  <text class="small-title" x="1448" y="1056">人工与调试链路</text>
  <text class="small-text" x="1448" y="1080">gamepad_receiver 接收手柄 UDP</text>
  <text class="small-text" x="1448" y="1102">arbitrator 支持人工覆盖</text>
  <text class="small-text" x="1448" y="1124">HUD 显示状态、速度、位姿、FPS</text>

  <rect class="box box-gray" x="70" y="1170" width="1660" height="85"/>
  <text class="small-title" x="88" y="1198">关键约束</text>
  <text class="small-text" x="88" y="1224">1. AR 位姿不参与 track_error、状态机决策或局部路径规划。  2. 上位机输出图像坐标系 final_track_error 和 desired_speed。  3. TC264D 负责 PID、PWM 硬限幅、串口超时与停车保护。</text>

  <!-- Main arrows -->
  <path class="arrow-blue" d="M430 258 C470 258, 485 258, 525 258"/>
  <text class="arrow-label" x="454" y="246">pose UDP</text>

  <path class="arrow-blue" d="M775 258 C790 258, 785 258, 800 258"/>
  <text class="arrow-label" x="780" y="246">local UDP</text>

  <path class="arrow-green" d="M925 320 C925 335, 925 335, 925 350"/>
  <text class="arrow-label" x="940" y="342">shm_ar_video</text>

  <path class="arrow-green" d="M775 490 L800 490"/>
  <path class="arrow-green" d="M1025 490 L1050 490"/>
  <path class="arrow-orange" d="M1175 550 C1175 565, 663 565, 663 580"/>
  <path class="arrow-orange" d="M775 648 L800 648"/>
  <path class="arrow-orange" d="M1025 648 L1050 648"/>
  <path class="arrow-orange" d="M1175 715 C1175 735, 663 725, 663 745"/>
  <path class="arrow-orange" d="M775 792 L800 792"/>
  <path class="arrow-orange" d="M1025 792 L1390 792"/>
  <text class="arrow-label" x="1265" y="780">UART1 460800</text>

  <path class="arrow-orange" d="M1575 300 L1575 325"/>
  <path class="arrow-orange" d="M1575 420 L1575 445"/>
  <path class="arrow-orange" d="M1575 565 L1575 590"/>
  <path class="arrow-orange" d="M1575 695 L1575 720"/>
  <path class="arrow-orange" d="M1575 825 L1575 850"/>

  <path class="arrow-dash" d="M1420 790 C1350 790, 1350 835, 1300 835"/>
  <text class="arrow-label" x="1320" y="853">feedback</text>

  <path class="arrow-blue" d="M430 648 C500 648, 500 792, 550 792"/>
  <text class="arrow-label" x="452" y="626">gamepad UDP</text>

  <path class="arrow-blue" d="M430 388 C505 388, 465 258, 525 258"/>
  <text class="arrow-label" x="454" y="374">WebUI config / WASD</text>

  <path class="arrow-blue" d="M1200 320 C1200 390, 1200 380, 1200 430"/>
  <text class="arrow-label" x="1214" y="374">status / preview</text>

  <path class="arrow-blue" d="M1075 262 C780 900, 430 518, 430 518"/>
  <text class="arrow-label" x="538" y="918">HTTP MJPEG 8090/debug_feed</text>

  <!-- Legend -->
  <rect class="box box-blue" x="1180" y="35" width="22" height="16"/>
  <text class="legend-text" x="1210" y="49">外部输入/远程查看</text>
  <rect class="box box-green" x="1360" y="35" width="22" height="16"/>
  <text class="legend-text" x="1390" y="49">RK 感知/视频</text>
  <rect class="box box-orange" x="1510" y="35" width="22" height="16"/>
  <text class="legend-text" x="1540" y="49">状态/控制执行</text>
</svg>
